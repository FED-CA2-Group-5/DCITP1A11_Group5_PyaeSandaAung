<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body class="bg-amber-100 p-15">

<header>
    <h1 class="text-6xl font-bold">Contact Us</h1>
</header>

<main>

<section>

<h2 class="ml-4 mt-3">Get in Touch</h2>

<p class="ml-4">
Have a question or a recipe you'd like to share? We'd love to hear from you!
</p>

</section>

<section >

<h2 class="m-4 text-3xl font-bold">Submit Your Recipe</h2>

<form id="submitRecipeForm" class="inline-flex flex-col m-4 border-2 p-4 rounded-xl">

<fieldset class="">

<legend>Recipe Submission Form</legend>

<p>
    <label for="name">Name:</label>
    <input type="text" name="name" minlength="1" maxlength="20"
         id="name" class="border p-1 mt-2 mb-6 bg-white"><br>
</p>

<p>
    <label for="email">Email:</label>
    <input type="email" name="email" minlength="1" maxlength="100"
         id="email" class="border p-1 mt-2 mb-6 bg-white "><br>
</p>

<p>
<label for="recipe">Recipe Name:</label><br>
<input type="text" id="recipe" name="recipe"
    class="border mt-2 mb-6 p-1 bg-white ">
</p>

<p>
<label for="ingredients">Ingredients:</label><br>
<textarea id="ingredients" name="ingredients" rows="5"
        class="border px-15 mt-2 mb-6 bg-white "></textarea>
</p>

<p>
    <label for="steps" class="flex -mb-4">Cooking Steps:</label><br>
    <textarea minlength="10"
         id="message" class="border mt-2 mb-6 bg-white p-15"></textarea><br>
</p>

<p>
<!--<input type="submit" value="Submit Recipe">-->
    <button type="submit" id="btnsubmit" 
        class="border p-1 w-17 rounded-lg bg-yellow-500 
            hover:bg-yellow-700 cursor-pointer">Submit</button>
</p>

</fieldset>

</form>

</section>

</main>

<footer>
<p>2026 Simply Savory</p>
</footer>

</body>
</html>
